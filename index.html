<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#0A0A0A;overflow:hidden}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}
a:hover{color:#FF7A00}
</style>
</helmet>
<div style="display:flex;flex-direction:column;height:100vh;font-family:'Geist Mono',monospace;background:#0A0A0A;color:#FFFFFF">
  <header style="display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:8px 24px;padding:4px clamp(16px,3vw,32px);border-bottom:1px solid #2A2A2A">
    <nav style="display:flex;gap:clamp(16px,2.4vw,32px);font-size:11px;letter-spacing:.08em;text-transform:uppercase">
      <button onClick="{{ show6 }}" style="border:0;padding:4px 0;cursor:pointer;font:inherit;letter-spacing:inherit;text-transform:inherit;background:none;color:{{ fg6 }}">Opción A</button>
      <button onClick="{{ show4 }}" style="border:0;padding:4px 0;cursor:pointer;font:inherit;letter-spacing:inherit;text-transform:inherit;background:none;color:{{ fg4 }}">Opción B</button>
      <button onClick="{{ show5 }}" style="border:0;padding:4px 0;cursor:pointer;font:inherit;letter-spacing:inherit;text-transform:inherit;background:none;color:{{ fg5 }}">Opción C</button>
    </nav>
  </header>
  <div style="position:relative;flex:1;min-height:0;background:#FFFFFF">
    <iframe src="opcion-b.html" title="Opción B" style="position:absolute;inset:0;width:100%;height:100%;border:0;display:{{ d4 }}"></iframe>
    <iframe src="opcion-c.html" title="Opción C" style="position:absolute;inset:0;width:100%;height:100%;border:0;display:{{ d5 }}"></iframe>
    <iframe src="opcion-a.html" title="Opción A" style="position:absolute;inset:0;width:100%;height:100%;border:0;display:{{ d6 }}"></iframe>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { v: (() => { try { return localStorage.getItem('pb-prop-v') || '6'; } catch (e) { return '6'; } })() };
  set(v) { this.setState({ v }); try { localStorage.setItem('pb-prop-v', v); } catch (e) {} }
  renderVals() {
    const v = this.state.v, on = k => v === k;
    const o = {};
    ['4', '5', '6'].forEach(k => {
      o['show' + k] = () => this.set(k);
      o['bg' + k] = on(k) ? '#FF7A00' : 'transparent';
      o['fg' + k] = on(k) ? '#FF7A00' : '#8A8A8A';
      o['d' + k] = on(k) ? 'block' : 'none';
    });
    return o;
  }
}
</script>
</body>
</html>
